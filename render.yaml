services:
  - type: web
    name: merchandise-management
    env: python
    plan: standard
    autoDeployTrigger: commit
    buildCommand: bash scripts/install_tesseract_render.sh && pip install -r requirements.txt && python scripts/verify_render_build.py
    healthCheckPath: /healthz
    startCommand: bash scripts/start_render.sh
    disk:
      name: uploads-storage
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 200
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRIMARY_DOMAIN
        value: stock.kaika-potential.co.jp
      - key: PRIMARY_SCHEME
        value: https

# Configure DATABASE_URL and SECRET_KEY in the Render dashboard.
