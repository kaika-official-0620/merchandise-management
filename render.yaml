services:
  - type: web
    name: merchandise-management
    env: python
    plan: standard
    autoDeployTrigger: commit
    buildCommand: (apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-jpn || true) && pip install -r requirements.txt
    healthCheckPath: /healthz
    startCommand: gunicorn render_app:app --bind 0.0.0.0:$PORT --timeout 300
    disk:
      name: uploads-storage
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 200
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRIMARY_DOMAIN
        value: stock.kaika-potential.co.jp
      - key: PRIMARY_SCHEME
        value: https

# Configure DATABASE_URL and SECRET_KEY in the Render dashboard.
