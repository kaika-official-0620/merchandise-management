{% extends "base.html" %}
{% block title %}新規お問い合わせ - 株式会社 開花{% endblock %}

{% block content %}
<div class="page-header">
    <h1>新規お問い合わせ</h1>
</div>

<div class="inquiry-form-container">
    <form method="POST" class="inquiry-form">
        <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" name="category" class="form-control">
                {% for key, value in categories.items() %}
                <option value="{{ key }}">{{ value }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="title">タイトル <span class="required">*</span></label>
            <input type="text" id="title" name="title" class="form-control" required
                   placeholder="お問い合わせの件名を入力してください">
        </div>
        
        <div class="form-group">
            <label for="content">内容 <span class="required">*</span></label>
            <textarea id="content" name="content" class="form-control" rows="8" required
                      placeholder="お問い合わせ内容を詳しくご記入ください"></textarea>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('inquiry_list') }}" class="btn btn-secondary">キャンセル</a>
            <button type="submit" class="btn btn-primary">送信する</button>
        </div>
    </form>
</div>

<style>
.inquiry-form-container {
    max-width: 700px;
    margin: 0 auto;
}

.inquiry-form {
    background: white;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #1e293b;
}

.required {
    color: #ef4444;
}

.form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-control:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

textarea.form-control {
    resize: vertical;
    min-height: 150px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e2e8f0;
}

.btn {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s;
}

.btn-primary {
    background: #2563eb;
    color: white;
    border: none;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #e2e8f0;
}

.btn-secondary:hover {
    background: #e2e8f0;
}
</style>
{% endblock %}
