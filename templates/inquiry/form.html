{% extends "base.html" %}
{% block title %}新規お問い合わせ - 株式会社 開花{% endblock %}

{% block content %}
<div class="page-header">
    <h1>新規お問い合わせ</h1>
</div>

<div class="inquiry-form-container">
    <form method="POST" class="inquiry-form" enctype="multipart/form-data">
        <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" name="category" class="form-control">
                {% for key, value in categories.items() %}
                <option value="{{ key }}">{{ value }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="title">タイトル <span class="required">*</span></label>
            <input type="text" id="title" name="title" class="form-control" required
                   placeholder="お問い合わせの件名を入力してください">
        </div>
        
        <div class="form-group">
            <label for="content">内容 <span class="required">*</span></label>
            <textarea id="content" name="content" class="form-control" rows="8" required
                      placeholder="お問い合わせ内容を詳しくご記入ください"></textarea>
        </div>
        
        <div class="form-group">
            <label>📷 画像添付（任意・最大5枚）</label>
            <div class="image-upload-area" id="imageUploadArea">
                <input type="file" id="images" name="images" accept="image/*" multiple class="image-input" onchange="previewImages(this)">
                <div class="upload-placeholder" id="uploadPlaceholder">
                    <span class="upload-icon">📁</span>
                    <span class="upload-text">クリックまたはドラッグ&ドロップで画像を選択</span>
                    <span class="upload-hint">PNG, JPG, GIF（各最大5MB・最大5枚）</span>
                </div>
            </div>
            <div class="images-preview-container" id="imagesPreviewContainer"></div>
            <small class="form-help">スクリーンショットやエラー画面など、問い合わせに関連する画像があれば添付してください</small>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('inquiry_list') }}" class="btn btn-secondary">キャンセル</a>
            <button type="submit" class="btn btn-primary">送信する</button>
        </div>
    </form>
</div>

<style>
.inquiry-form-container {
    max-width: 700px;
    margin: 0 auto;
}

.inquiry-form {
    background: white;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #1e293b;
}

.required {
    color: #ef4444;
}

.form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-control:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

textarea.form-control {
    resize: vertical;
    min-height: 150px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e2e8f0;
}

.btn {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s;
}

.btn-primary {
    background: #2563eb;
    color: white;
    border: none;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #e2e8f0;
}

.btn-secondary:hover {
    background: #e2e8f0;
}

/* 画像アップロードエリア */
.image-upload-area {
    position: relative;
    border: 2px dashed #d1d5db;
    border-radius: 8px;
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #f9fafb;
}

.image-upload-area:hover {
    border-color: #2563eb;
    background: #eff6ff;
}

.image-upload-area.dragover {
    border-color: #2563eb;
    background: #dbeafe;
}

.image-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.upload-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
}

.upload-icon {
    font-size: 2rem;
}

.upload-text {
    font-size: 0.95rem;
    color: #374151;
}

.upload-hint {
    font-size: 0.8rem;
    color: #9ca3af;
}

/* 複数画像プレビューコンテナ */
.images-preview-container {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 0.75rem;
}

.image-preview-item {
    position: relative;
    display: inline-block;
}

.image-preview-item img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.remove-image {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ef4444;
    color: white;
    border: 2px solid white;
    cursor: pointer;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.remove-image:hover {
    background: #dc2626;
}

.image-count-badge {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 0.25rem 0.5rem;
    border-radius: 12px;
    font-size: 0.75rem;
    margin-left: 0.5rem;
}

.form-help {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: #6b7280;
}
</style>

<script>
let selectedFiles = [];
const MAX_FILES = 5;

function previewImages(input) {
    const container = document.getElementById('imagesPreviewContainer');
    const files = Array.from(input.files);
    
    // 既存のファイルと新しいファイルを結合（最大5枚まで）
    const newFiles = files.slice(0, MAX_FILES - selectedFiles.length);
    selectedFiles = [...selectedFiles, ...newFiles].slice(0, MAX_FILES);
    
    updatePreview();
    updateFileInput();
    
    if (files.length > MAX_FILES - (selectedFiles.length - newFiles.length)) {
        alert(`最大${MAX_FILES}枚までアップロードできます`);
    }
}

function updatePreview() {
    const container = document.getElementById('imagesPreviewContainer');
    container.innerHTML = '';
    
    selectedFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const div = document.createElement('div');
            div.className = 'image-preview-item';
            div.innerHTML = `
                <img src="${e.target.result}" alt="プレビュー ${index + 1}">
                <button type="button" class="remove-image" onclick="removeImage(${index})">✕</button>
            `;
            container.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

function updateFileInput() {
    // DataTransferを使用して選択されたファイルを更新
    const input = document.getElementById('images');
    const dataTransfer = new DataTransfer();
    
    selectedFiles.forEach(file => {
        dataTransfer.items.add(file);
    });
    
    input.files = dataTransfer.files;
}

function removeImage(index) {
    selectedFiles.splice(index, 1);
    updatePreview();
    updateFileInput();
}

// ドラッグ&ドロップ対応
const uploadArea = document.getElementById('imageUploadArea');

uploadArea.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
});

uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length > 0) {
        const newFiles = files.slice(0, MAX_FILES - selectedFiles.length);
        selectedFiles = [...selectedFiles, ...newFiles].slice(0, MAX_FILES);
        
        updatePreview();
        updateFileInput();
        
        if (files.length > MAX_FILES - (selectedFiles.length - newFiles.length)) {
            alert(`最大${MAX_FILES}枚までアップロードできます`);
        }
    }
});
</script>
{% endblock %}
