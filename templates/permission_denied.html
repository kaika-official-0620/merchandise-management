{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>{{ title or '権限が付与されていません' }}</h1>
</div>

<div class="form-container" style="max-width: 720px;">
    <div class="form-section" style="text-align: center; padding: 2rem 1.5rem;">
        <div style="font-size: 3rem; margin-bottom: 0.75rem;">403</div>
        <p style="margin: 0 0 1rem; color: #475569; font-size: 1rem; line-height: 1.7;">
            {{ message or 'この機能を利用する権限が付与されていません。' }}

        <p style="margin: 0; color: #64748b; font-size: 0.9rem;">
