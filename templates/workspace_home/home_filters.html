<form class="filters" method="get" action="{{ url_for('workspace_home.home') }}" role="search"><label class="filter-search">商品・管理番号{% if staff %}・顧客番号{% endif %}で探す<input type="search" name="q" value="{{ home_view.q }}" maxlength="100" placeholder="商品名や番号を入力"></label><label>表示する内容<select name="view">{% for value,label in home_view.choices %}<option value="{{ value }}" {% if value==home_view.selected %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button>絞り込む</button>{% if home_view.q or home_view.selected != 'all' %}<a class="action-link secondary" href="{{ url_for('workspace_home.home') }}">解除</a>{% endif %}</form>
