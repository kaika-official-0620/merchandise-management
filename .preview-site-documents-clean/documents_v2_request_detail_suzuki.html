<!DOCTYPE html>
    <html lang="ja">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>鈴木 一郎 さんの受付詳細</title>
      <link rel="stylesheet" href="static/preview_v2.css">

    </head>
    <body>

    <div class="page">

<div class="back-bar">
  <a class="btn btn-outline" href="documents_v2_index.html">書類一覧</a>
  <a class="btn btn-outline" href="javascript:history.back()">1つ前に戻る</a>
</div>

      <div class="page-head">
        <div>
          <h1>鈴木 一郎 さんの受付詳細</h1>
          <p>REQ-2026-038 / 受付日 2026/04/17 / 業者オークション。ここで商品ごとに、認証済み・査定中・入金待ち・受付不可通知を切り替えます。査定中にした業者卸販売の商品だけが 2番へ進みます。</p>
        </div>
      </div>
      <div class="section">
        <div class="section-head">
          <div>
            <h3>商品ごとの確認</h3>
            <p class="section-note">商品名を押すと、商品一覧で登録している内容をそのまま確認できます。</p>
          </div>
        </div>
        <div class="stack">

<div class="product-card">
  <div class="product-thumb">
    <img src="static/img_rolex_dj.svg" alt="ロレックス デイトジャスト 36">
  </div>
  <div class="product-body">
    <div class="product-top">
      <div>
        <div class="product-title"><a href="documents_v2_product_detail_rolex.html">ロレックス デイトジャスト 36</a></div>
        <div class="product-meta">鈴木 一郎 / 業者オークション / ROLEX / 商品ID KAIKA-301</div>
      </div>
      <span id="badge-rolex_dj" class="pill approved">認証済み</span>
    </div>
    <div class="detail-grid">
      <div class="field-block"><div class="field-label">カテゴリ</div><div class="field-value">時計</div></div>
      <div class="field-block"><div class="field-label">ブランド</div><div class="field-value">ROLEX</div></div>
      <div class="field-block"><div class="field-label">モデル</div><div class="field-value">デイトジャスト 36</div></div>
      <div class="field-block"><div class="field-label">状態</div><div class="field-value">A</div></div>
    </div>
    <div class="card-actions">
      <a class="btn btn-soft" href="documents_v2_product_detail_rolex.html">商品詳細を見る</a>
    </div>

<div class="status-box">
  <div class="status-row">
    <span class="field-label">現在の状態</span>
    <span id="state-rolex_dj" class="field-value">認証済み</span>
  </div>
  <div class="status-row">
    <select id="status-rolex_dj" class="status-select">
      <option value="認証済み" selected>認証済み</option><option value="査定中" >査定中</option><option value="入金待ち" >入金待ち</option>
    </select>
    <button class="btn btn-primary" type="button" onclick="applyStatus('status-rolex_dj','badge-rolex_dj','state-rolex_dj','notice-rolex_dj','ロレックス デイトジャスト 36')">状態を更新して通知</button>
  </div>
  <div class="status-row">
    <button class="btn btn-outline" type="button" onclick="notifyUnavailable('notice-rolex_dj','badge-rolex_dj','state-rolex_dj','ロレックス デイトジャスト 36')">受付不可を通知する</button>
  </div>
  <p id="notice-rolex_dj" class="inline-notice" hidden></p>
</div>

  </div>
</div>

        </div>
      </div>
    </div>

    <script src="static/preview_v2.js"></script>

    </body>
    </html>
