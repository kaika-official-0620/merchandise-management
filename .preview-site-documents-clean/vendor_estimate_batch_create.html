<!DOCTYPE html>
    <html lang="ja">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>見積依頼書を作成する</title>
      <link rel="stylesheet" href="static/preview_v2.css">

    </head>
    <body>

    <div class="page">

<div class="back-bar">
  <a class="btn btn-outline" href="documents_v2_index.html">書類一覧</a>
  <a class="btn btn-outline" href="javascript:history.back()">1つ前に戻る</a>
</div>

      <div class="page-head">
        <div>
          <h1>見積依頼書を作成する</h1>
          <p>ここでは、業者へ流したい商品をチェックして既存の見積依頼書テンプレートへ差し込みます。件名や本文ではなく、商品・送付先・テンプレートだけを整える形です。</p>
        </div>
      </div>
      <div class="two-col">
        <div class="section">
          <div class="section-head"><h3>見積依頼書に入れる商品</h3></div>
          <div class="select-grid">
        <label class="select-row">
          <input class="vendor-check" type="checkbox" data-product="アズール サリナPM トートバッグ" data-summary="テスト / アズール サリナPM トートバッグ / Louis Vuitton">
          <span class="select-main">テスト / アズール サリナPM トートバッグ</span>
          <span class="select-sub">Louis Vuitton / 商品ID KAIKA-145</span>
        </label>

        <label class="select-row">
          <input class="vendor-check" type="checkbox" data-product="ズッカ柄 マンマ金具/ワンショルダー ショルダーバッグ" data-summary="テスト / ズッカ柄 マンマ金具/ワンショルダー ショルダーバッグ / Fendi">
          <span class="select-main">テスト / ズッカ柄 マンマ金具/ワンショルダー ショルダーバッグ</span>
          <span class="select-sub">Fendi / 商品ID KAIKA-151</span>
        </label>
        </div>
        </div>
        <div class="section">
          <div class="section-head"><h3>見積依頼書の設定</h3></div>
          <div class="form-grid">
            <label class="field"><span>送付先業者</span><select><option>選択してください</option><option>ブランドセンター</option><option>ブランド市場</option><option>Luxe Gate</option></select></label>
            <label class="field"><span>書類種別</span><select><option>見積依頼書</option></select></label>
            <label class="field field-wide"><span>備考</span><textarea rows="4" placeholder="必要な場合だけ備考を入力"></textarea></label>
          </div>
          <div class="mini-panel">
            <strong>選択中の商品</strong>
            <div id="vendor-selected-summary" style="margin-top:8px;color:#475569;">まだ商品を選択していません</div>
          </div>
          <div class="card-actions" style="margin-top: 16px;">
            <a class="btn btn-outline" href="vendor_partner_registry.html">送付先業者を登録・編集する</a>
            <a class="btn btn-primary" href="documents_v2_vendor_estimate_template.html">テンプレートへ差し込む</a>
          </div>
        </div>
      </div>
    </div>

    <script src="static/preview_v2.js"></script>

    </body>
    </html>
