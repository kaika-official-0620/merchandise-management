<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書類管理プレビュー</title>
  <link rel="stylesheet" href="static/preview.css">
</head>
<body>
  <div class="page">
    <div class="page-head">
      <div>
        <h1>書類管理</h1>
        <p>クライアント受付からクライアント返送までを、段階ごとに確認するプレビューです。</p>
      </div>
    </div>

    <div class="flow-grid">
      <a class="flow-card" href="client_incoming.html">
        <div class="flow-step">1</div>
        <h2>クライアントから受付</h2>
        <p>クライアントから届いた依頼書と対象商品を確認します。</p>
        <div class="flow-count">進行中 4件</div>
      </a>
      <a class="flow-card" href="vendor_outgoing.html">
        <div class="flow-step">2</div>
        <h2>開花から業者へ依頼</h2>
        <p>業者卸販売の商品を選んで、業者向け見積依頼書を作成します。</p>
        <div class="flow-count">進行中 2件</div>
      </a>
      <a class="flow-card" href="vendor_incoming.html">
        <div class="flow-step">3</div>
        <h2>業者から回答受領</h2>
        <p>業者から届いた回答書類を登録し、月ごとに確認します。</p>
        <div class="flow-count">受領待ち 1件</div>
      </a>
      <a class="flow-card" href="client_outgoing.html">
        <div class="flow-step">4</div>
        <h2>クライアントへ返送</h2>
        <p>売れた商品だけを選んで、クライアント向け書類を作成します。</p>
        <div class="flow-count">返送待ち 3件</div>
      </a>
    </div>
  </div>
</body>
</html>
