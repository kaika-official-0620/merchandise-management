<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書類管理</title>
  <link rel="stylesheet" href="static/preview_v2.css">

</head>
<body>

<div class="page">
  <div class="page-head">
    <div>
      <h1>書類管理</h1>
      <p>1番から4番までの流れを管理者向けにまとめています。トップでは 2×2 の導線だけを見せ、各段階の中身は個別ページで確認します。</p>
    </div>
  </div>
  <div class="flow-grid">
    <a class="flow-card" href="documents_v2_client_incoming.html">
      <span class="flow-step">1</span>
      <h2>クライアントから受付</h2>
      <p>どのクライアントから何の商品が届いたかを、名前単位で確認します。</p>
      <span class="flow-count">6点受付中</span>
    </a>

    <a class="flow-card" href="documents_v2_vendor_outgoing.html">
      <span class="flow-step">2</span>
      <h2>開花から業者へ依頼</h2>
      <p>査定中に切り替えた業者卸販売の商品だけをまとめて業者へ流します。</p>
      <span class="flow-count">2点準備中</span>
    </a>

    <a class="flow-card" href="documents_v2_vendor_incoming.html">
      <span class="flow-step">3</span>
      <h2>業者から回答受領</h2>
      <p>業者から届いた回答ファイルを1件ずつ確認し、商品ごとに返送先を振り分けます。</p>
      <span class="flow-count">2ファイル受領</span>
    </a>

    <a class="flow-card" href="documents_v2_client_outgoing.html">
      <span class="flow-step">4</span>
      <h2>クライアントへ返送</h2>
      <p>クライアントごとに書類をまとめて作成し、返送内容を確認します。</p>
      <span class="flow-count">3名へ返送準備</span>
    </a>
    </div>
</div>

<script src="static/preview_v2.js"></script>

</body>
</html>
