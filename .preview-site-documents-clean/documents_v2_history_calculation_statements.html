      <div class="section">
        <div class="section-head">
          <div>
            <h3>送付済みの計算書</h3>

              <summary>説明を見る</summary>
              <p>代行仕入れの計算書を作成・送付した場合にここへ追加されます。</p>
            </details>
          </div>
        </div>
        <div id="completed-doc-history" class="stack" data-completed-filter="calculation_statement"></div>

      </div>

      <div class="section">

          <div>
            <h3>保存済み履歴</h3>

        </div>
        <div class="filter-row">

          <label class="field history-filter-field">
            <span>対象月</span>
            <input id="history-month-filter" type="month">
          </label>
          <label class="field history-filter-field">
            <span>開始日</span>
            <input id="history-date-from" type="date">
          </label>
          <label class="field history-filter-field">
            <span>終了日</span>
            <input id="history-date-to" type="date">
          </label>
          <button class="btn btn-outline btn-compact history-clear-btn" type="button" onclick="clearHistoryFilters()">絞り込みを解除</button>
        </div>
        <div class="stack">
        <div class="file-card js-filter-card js-history-card" data-search="2026/03 代行仕入れ計算書履歴 代行仕入れ計算書 レザー ムーンサイド ショルダーバッグ 代行仕入れ 2026/03 2026-03-22" data-title="2026/03 代行仕入れ計算書履歴" data-date="2026-03-22" data-month="2026-03">
