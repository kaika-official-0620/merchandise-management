<!DOCTYPE html>
    <html lang="ja">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>高橋 愛 さんの受付詳細</title>
      <link rel="stylesheet" href="static/preview_v2.css">

    </head>
    <body>

    <div class="page">

<div class="back-bar">
  <a class="btn btn-outline" href="documents_v2_index.html">書類一覧</a>
  <a class="btn btn-outline" href="javascript:history.back()">1つ前に戻る</a>
</div>

      <div class="page-head">
        <div>
          <h1>高橋 愛 さんの受付詳細</h1>
          <p>REQ-2026-037 / 受付日 2026/04/16 / 同時出品。ここで商品ごとに、認証済み・査定中・入金待ち・受付不可通知を切り替えます。査定中にした業者卸販売の商品だけが 2番へ進みます。</p>
        </div>
      </div>
      <div class="section">
        <div class="section-head">
          <div>
            <h3>商品ごとの確認</h3>
            <p class="section-note">商品名を押すと、商品一覧で登録している内容をそのまま確認できます。</p>
          </div>
        </div>
        <div class="stack">

<div class="product-card">
  <div class="product-thumb">
    <img src="static/img_celine_luggage.svg" alt="セリーヌ ラゲージ ナノ">
  </div>
  <div class="product-body">
    <div class="product-top">
      <div>
        <div class="product-title"><a href="documents_v2_product_detail_celine_luggage.html">セリーヌ ラゲージ ナノ</a></div>
        <div class="product-meta">高橋 愛 / 同時出品 / CELINE / 商品ID KAIKA-401</div>
      </div>
      <span id="badge-celine_luggage" class="pill payment">入金待ち</span>
    </div>
    <div class="detail-grid">
      <div class="field-block"><div class="field-label">カテゴリ</div><div class="field-value">バッグ</div></div>
      <div class="field-block"><div class="field-label">ブランド</div><div class="field-value">CELINE</div></div>
      <div class="field-block"><div class="field-label">モデル</div><div class="field-value">ラゲージ ナノ</div></div>
      <div class="field-block"><div class="field-label">状態</div><div class="field-value">A</div></div>
    </div>
    <div class="card-actions">
      <a class="btn btn-soft" href="documents_v2_product_detail_celine_luggage.html">商品詳細を見る</a>
    </div>

<div class="status-box">
  <div class="status-row">
    <span class="field-label">現在の状態</span>
    <span id="state-celine_luggage" class="field-value">入金待ち</span>
  </div>
  <div class="status-row">
    <select id="status-celine_luggage" class="status-select">
      <option value="認証済み" >認証済み</option><option value="査定中" >査定中</option><option value="入金待ち" selected>入金待ち</option>
    </select>
    <button class="btn btn-primary" type="button" onclick="applyStatus('status-celine_luggage','badge-celine_luggage','state-celine_luggage','notice-celine_luggage','セリーヌ ラゲージ ナノ')">状態を更新して通知</button>
  </div>
  <div class="status-row">
    <button class="btn btn-outline" type="button" onclick="notifyUnavailable('notice-celine_luggage','badge-celine_luggage','state-celine_luggage','セリーヌ ラゲージ ナノ')">受付不可を通知する</button>
  </div>
  <p id="notice-celine_luggage" class="inline-notice" hidden></p>
</div>

  </div>
</div>

        </div>
      </div>
    </div>

    <script src="static/preview_v2.js"></script>

    </body>
    </html>
