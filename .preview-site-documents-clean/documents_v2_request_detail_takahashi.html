<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申請詳細 - 高橋 愛</title>
  <link rel="stylesheet" href="static/preview_v2.css">
</head>
<body>
  <div class="page">
    <div class="back-bar">
      <a class="btn btn-outline" href="documents_v2_index.html">書類一覧</a>
      <a class="btn btn-outline" href="documents_v2_client_incoming_simultaneous.html">1個前に戻る</a>
    </div>
    <div class="section">
      <div class="section-head">
        <div>
          <h3>申請詳細</h3>
          <p class="section-note">同時出品のため、売却が発生した商品だけを4番へ反映する想定です。</p>
        </div>
      </div>
      <div class="product-line">
        <div class="product-thumb has-image">
          <img src="static/img_celine_luggage.svg" alt="セリーヌ ラゲージ">
          <div class="product-thumb-caption">申請画像 / セリーヌ ラゲージ</div>
        </div>
        <div>
          <div class="product-head">
            <div>
              <div class="product-title"><a href="documents_v2_product_detail_celine_luggage.html">セリーヌ ラゲージ</a></div>
              <div class="product-meta">バッグ / 商品ID KAIKA-105</div>
            </div>
            <span id="takahashi-badge-1" class="pill approved">認証済み</span>
          </div>
          <div class="detail-grid">
            <div class="field-block"><div class="field-label">現在の状態</div><div id="takahashi-state-1" class="field-value">認証済み</div></div>
            <div class="field-block"><div class="field-label">依頼書</div><div class="field-value">見積依頼書</div></div>
            <div class="field-block"><div class="field-label">受付日時</div><div class="field-value">2026/04/15 15:05</div></div>
            <div class="field-block"><div class="field-label">メモ</div><div class="field-value">同時出品で売れた分だけ返送書類へ</div></div>
          </div>
          <div class="status-row">
            <select id="takahashi-select-1">
              <option>認証待ち</option>
              <option selected>認証済み</option>
              <option>査定中</option>
              <option>入金待ち</option>
            </select>
            <button class="btn btn-primary" type="button" onclick="applyStatus('takahashi-select-1','takahashi-badge-1','takahashi-state-1','takahashi-notice-1','セリーヌ ラゲージ')">状態を反映する</button>
            <button class="btn btn-outline" type="button" onclick="notifyUnavailable('takahashi-notice-1','takahashi-badge-1','takahashi-state-1','セリーヌ ラゲージ')">受付不可を通知する</button>
          </div>
          <div id="takahashi-notice-1" class="inline-notice" hidden></div>
        </div>
      </div>
    </div>
  </div>
  <script src="static/preview_v2.js"></script>
</body>
</html>
