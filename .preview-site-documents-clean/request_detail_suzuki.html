<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申請詳細 - 鈴木 一郎</title>
  <link rel="stylesheet" href="static/preview.css">
</head>
<body>
<div class="page">
  <div class="back-bar">
    <a class="btn btn-outline" href="index.html">書類一覧</a>
    <a class="btn btn-outline" href="javascript:history.back()">1個前に戻る</a>
  </div>
  <div class="section">
    <div class="section-head">
      <div>
        <h3>申請詳細</h3>
        <p class="section-note">業者オークション案件です。状態更新はここで行い、売却後に4番へつなげます。</p>
      </div>
    </div>
    <div class="product-list">
      <div class="product-card">
        <div class="request-item-layout">
          <div class="request-thumb">申請画像<br>ロレックス<br>時計</div>
          <div>
            <div class="product-head">
              <div>
                <div class="product-title"><a href="product_detail_rolex.html">ロレックス デイトジャスト</a></div>
                <div class="product-meta">時計 / 業者オークション / 商品ID KAIKA-301</div>
              </div>
              <span class="status-badge approved">認証済み</span>
            </div>
            <div class="request-item-grid">
              <div class="record-field"><div class="record-label">現在の状態</div><div class="record-value">認証済み</div></div>
              <div class="record-field"><div class="record-label">次の流れ</div><div class="record-value">落札後に4番で返送</div></div>
              <div class="record-field"><div class="record-label">クライアント表示</div><div class="record-value">認証済み</div></div>
            </div>
            <div class="status-action-list">
              <a class="status-action is-active" href="status_update_preview.html">認証済み</a>
              <a class="status-action" href="status_update_preview.html">査定中</a>
              <a class="status-action" href="status_update_preview.html">入金待ち</a>
              <a class="status-action" href="notify_unavailable.html">受付不可通知</a>
            </div>
            <div class="request-actions">
              <a class="btn btn-secondary" href="product_detail_rolex.html">商品詳細を見る</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
